name: Clean YNX diff

on:
  push:
    branches:
      - add-ynx-testnet-6423

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-ynx-testnet-6423
          fetch-depth: 0
      - name: Restore upstream formatting and insert YNX only
        run: |
          git show origin/main:chains.json > chains.json
          python - <<'PY'
          from pathlib import Path
          import json
          p=Path('chains.json')
          b=p.read_bytes()
          nl=b'\r\n' if b'\r\n' in b[:200] else b'\n'
          entry={
            "name":"YNX Testnet",
            "chainId":6423,
            "shortName":"ynxtest",
            "chain":"YNX",
            "network":"testnet",
            "networkId":6423,
            "nativeCurrency":{
              "name":"YNXT",
              "symbol":"YNXT",
              "decimals":18,
              "logo":"https://raw.githubusercontent.com/JiahaoAlbus/YNX-Chain-website/main/public/ynx-logo.png"
            },
            "rpc":["https://evm.ynxweb4.com"],
            "faucets":["https://www.ynxweb4.com/dapp/faucet"],
            "infoURL":"https://ynxweb4.com",
            "icon":"ynx",
            "explorers":[{"name":"YNX Explorer","url":"https://explorer.ynxweb4.com","standard":"EIP3091"}]
          }
          text=json.dumps(entry, indent=4, ensure_ascii=False)
          lines=text.splitlines()
          block=('    '+lines[0]+nl.decode()+nl.decode().join('    '+x for x in lines[1:])+','+nl.decode()).encode()
          if b'"chainId": 6423' not in b:
              prefix=b'['+nl
              if not b.startswith(prefix): raise SystemExit('unexpected chains.json format')
              b=prefix+block+b[len(prefix):]
          p.write_bytes(b)
          json.loads(p.read_text())
          PY
      - name: Remove temporary workflow and commit
        run: |
          rm .github/workflows/ynx-clean-diff.yml
          git config user.name "JiahaoAlbus"
          git config user.email "159010359+JiahaoAlbus@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: minimize YNX TokenPocket diff"
          git push origin HEAD:add-ynx-testnet-6423
